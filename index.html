<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIGAP PRAJA - Satpol PP Bangkalan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']},colors:{jagoDark:'#0f172a',jagoOrange:'#ea580c',jagoBg:'#f8fafc'},boxShadow:{soft:'0 8px 30px rgba(0,0,0,0.04)',btnDark:'0 4px 14px rgba(15,23,42,0.4)',btnOrange:'0 4px 14px rgba(234,88,12,0.4)',float:'0 -10px 40px rgba(0,0,0,0.05)'}}}}</script>
<style>
body{background:#f8fafc;margin:0;-webkit-tap-highlight-color:transparent;color:#0f172a}
.hide-scroll::-webkit-scrollbar{display:none}
.bouncy-active:active{transform:scale(0.96)}
.loader{border:3px solid #E2E8F0;border-radius:50%;border-top:3px solid #ea580c;width:32px;height:32px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-sheet{transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sheet-hidden{transform:translateY(100%)}.sheet-visible{transform:translateY(0)}
.glass-card{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8)}
.checkbox-custom:checked + div{background:#ea580c;border-color:#ea580c}
.checkbox-custom:checked + div svg{opacity:1;transform:scale(1)}
